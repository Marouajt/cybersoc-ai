name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualite:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances de développement
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Tests (pytest)
        run: python -m pytest -q

  compose:
    name: Validation docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Créer le .env de CI
        run: cp .env.example .env

      - name: Valider la configuration Compose (profil par défaut)
        run: docker compose config -q

      - name: Valider la configuration Compose (profil ops)
        run: docker compose --profile ops config -q

      - name: Démarrer Neo4j et vérifier qu'il répond
        run: |
          docker compose up -d
          # attendre que le healthcheck passe (max ~3 min)
          for i in $(seq 1 36); do
            status=$(docker inspect -f '{{.State.Health.Status}}' cybersoc-neo4j || echo "starting")
            echo "tentative $i : $status"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 5
          done
          docker compose exec -T neo4j cypher-shell -u neo4j -p changeme_local "RETURN 1 AS ok;"

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs --tail=200

      - name: Arrêt
        if: always()
        run: docker compose down -v
